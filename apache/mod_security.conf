# ModSecurity configuration for the dispatcher vhost (port 80).
# Replaces the package default /etc/httpd/conf.d/mod_security.conf.
# The renderer (port 4503) does not include conf.d/, so ModSecurity never runs there.
#
# No rules are built in. This baseline mirrors a hardened production mod_security.conf
# (package default SecRules and body limits removed, audit log only for 403s). Rules come from ./modsecurity/ on the host (mounted at
# ${MODSEC_ROOT}/rules), activated by the control panel through sandbox_rules.conf.
#
# MODSEC_ROOT can be overridden with `httpd -t -C "Define MODSEC_ROOT /tmp/x"` so the control
# panel can syntax-check a staged copy of the rules before touching the live files.
<IfModule mod_security2.c>
    <IfDefine !MODSEC_ROOT>
        Define MODSEC_ROOT /etc/httpd/modsecurity.d
    </IfDefine>

    SecRequestBodyAccess On
    SecPcreMatchLimit 1000
    SecPcreMatchLimitRecursion 1000
    SecResponseBodyAccess Off
    SecDebugLog /var/log/httpd/modsec_debug.log
    SecAuditEngine RelevantOnly
    SecAuditLogRelevantStatus "^403"
    SecAuditLogParts ABIJDEFHZ
    SecAuditLogType Serial
    SecAuditLog /var/log/httpd/modsec_audit.log
    SecArgumentSeparator &
    SecCookieFormat 0
    SecTmpDir /var/lib/mod_security
    SecDataDir /var/lib/mod_security

    Include ${MODSEC_ROOT}/sandbox_rules.conf
    # Last, so the control panel engine mode / debug level win over the rule files.
    Include ${MODSEC_ROOT}/sandbox_engine.conf
</IfModule>
